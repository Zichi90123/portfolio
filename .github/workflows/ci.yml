# Verify pipeline: build (with astro check), broken links, Lighthouse >= 95.
# Deploys are handled by the Cloudflare Pages Git integration (main = production,
# every other branch = preview), so this workflow needs no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # Internal links only (--offline): an external site being slow must not
      # break the build. Pages are built as name.html and linked as /name, which
      # Cloudflare Pages resolves: --fallback-extensions does the same here.
      - name: Broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --fallback-extensions html --root-dir "${{ github.workspace }}/dist" 'dist/**/*.html'
          fail: true

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
