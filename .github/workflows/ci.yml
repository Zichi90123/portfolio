# Verify, then deploy to Cloudflare Pages.
# - verify: build (with astro check), broken links, Lighthouse >= 95.
# - deploy: only after verify passes. A push to main publishes production; a pull
#   request from this repository gets its own preview URL. The site is never
#   published if a check fails.
# Needs the CLOUDFLARE_API_TOKEN secret (Account > Cloudflare Pages > Edit only)
# and the CLOUDFLARE_ACCOUNT_ID variable.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.162.0
  PAGES_PROJECT: portfolio

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # Internal links only (--offline): an external site being slow must not
      # break the build. Pages are built as name.html and linked as /name, which
      # Cloudflare Pages resolves: --fallback-extensions does the same here.
      - name: Broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --fallback-extensions html --root-dir "${{ github.workspace }}/dist" 'dist/**/*.html'
          fail: true

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      # The exact files that passed the checks are the ones deployed.
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: verify
    # Pull requests from forks get no secrets: skip instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: site
          path: dist

      - name: Create the Pages project if missing
        run: |
          if npx -y "wrangler@$WRANGLER_VERSION" pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Project $PAGES_PROJECT already exists"
          else
            npx -y "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main
          fi

      - name: Deploy
        id: deploy
        run: |
          npx -y "wrangler@$WRANGLER_VERSION" pages deploy dist \
            --project-name "$PAGES_PROJECT" --branch "$BRANCH" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
